# Builds a pull request without secrets. The service account is used only by
# the workflow_run upload from the default branch.
# contents: read matches CI and is enough to upload the build artifact.

name: Hosting preview build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: combat-training-app
    env:
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Require public Firebase config
        run: |
          set -euo pipefail
          missing=0
          require() {
            if [ -z "${1//[[:space:]]/}" ]; then
              echo "::error::Brak zmiennej repozytorium ${2}. Ustaw ją w Settings → Secrets and variables → Actions → Variables. Nie dodawaj zmiennych emulatora."
              missing=1
            fi
          }
          require "$VITE_FIREBASE_API_KEY" VITE_FIREBASE_API_KEY
          require "$VITE_FIREBASE_AUTH_DOMAIN" VITE_FIREBASE_AUTH_DOMAIN
          require "$VITE_FIREBASE_PROJECT_ID" VITE_FIREBASE_PROJECT_ID
          require "$VITE_FIREBASE_APP_ID" VITE_FIREBASE_APP_ID
          exit "$missing"

      - uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
          cache: npm
          cache-dependency-path: combat-training-app/package-lock.json

      - run: npm ci
      - run: npm run build:deploy

      - uses: actions/upload-artifact@v7
        with:
          name: hosting-preview-dist
          path: combat-training-app/dist
          retention-days: 3
          if-no-files-found: error

  pull-request-number:
    name: Record pull request number
    needs: build
    if: success() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Runs after the build job so a script started by npm cannot replace this file.
      - name: Write pull request number
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Numer PR nie jest liczbą."
            exit 1
          fi
          printf '%s\n' "$PR_NUMBER" > "$GITHUB_WORKSPACE/hosting-preview-pr.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: hosting-preview-pr
          path: hosting-preview-pr.txt
          retention-days: 3
          if-no-files-found: error
          overwrite: true
