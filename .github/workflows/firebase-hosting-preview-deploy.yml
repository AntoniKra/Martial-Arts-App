# Uploads a preview from the default branch. It checks out that branch for
# firebase.json, copies the built files, and does not run project scripts.
# Deploys for one pull request are serialized and a stale build is rejected.

name: Hosting preview deploy

on:
  workflow_run:
    workflows: ["Hosting preview build"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: hosting-preview-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload preview
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download pull request number
        uses: actions/download-artifact@v7
        with:
          name: hosting-preview-pr
          path: preview-pr
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Reject a mismatched or stale preview
        env:
          ARTIFACT_PR_FILE: ${{ github.workspace }}/preview-pr/hosting-preview-pr.txt
          RUN_ID: ${{ github.event.workflow_run.id }}
          BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash .github/scripts/hosting-guard.sh preview-guard

      - name: Download built site
        uses: actions/download-artifact@v7
        with:
          name: hosting-preview-dist
          path: preview-artifact
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Prepare untrusted artifact
        run: |
          set -euo pipefail
          src="$GITHUB_WORKSPACE/preview-artifact"
          if [ -f "$src/index.html" ]; then
            dist_src="$src"
          elif [ -f "$src/dist/index.html" ]; then
            dist_src="$src/dist"
          elif [ -f "$src/combat-training-app/dist/index.html" ]; then
            dist_src="$src/combat-training-app/dist"
          else
            echo "::error::W artefakcie nie ma index.html."
            exit 1
          fi
          link="$(find "$dist_src" -type l -print -quit)"
          if [ -n "$link" ]; then
            echo "::error::Artefakt zawiera dowiązanie. Przerywam."
            exit 1
          fi
          rm -rf "$GITHUB_WORKSPACE/combat-training-app/dist"
          mkdir -p "$GITHUB_WORKSPACE/combat-training-app/dist"
          cp -R "$dist_src"/. "$GITHUB_WORKSPACE/combat-training-app/dist/"
          jq 'del(.hosting.predeploy)' "$GITHUB_WORKSPACE/combat-training-app/firebase.json" > "$RUNNER_TEMP/firebase.json"
          mv "$RUNNER_TEMP/firebase.json" "$GITHUB_WORKSPACE/combat-training-app/firebase.json"
          if jq -e '.hosting.predeploy' "$GITHUB_WORKSPACE/combat-training-app/firebase.json" > /dev/null; then
            echo "::error::Nie udało się wyłączyć predeploy w kopii roboczej."
            exit 1
          fi

      - name: Deploy preview channel
        id: hosting
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COMBAT_TRAINING_830FB }}
          projectId: combat-training-830fb
          channelId: pr-${{ env.PR_NUMBER }}
          entryPoint: combat-training-app
          expires: 7d
          disableComment: "true"

      - name: Comment on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.hosting.outputs.details_url }}
        run: |
          set -euo pipefail
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Numer PR nie jest liczbą."
            exit 1
          fi
          preview_url="$(printf '%s' "$PREVIEW_URL" | tr -d '[:space:]')"
          if ! [[ "$preview_url" =~ ^https://[A-Za-z0-9.-]+(/.*)?$ ]]; then
            echo "::error::Adres podglądu ma nieoczekiwany kształt."
            exit 1
          fi

          marker="<!-- firebase-hosting-preview -->"
          body="$(printf '%s\n\n**Podgląd:** %s\n\nKanał pr-%s wygasa po 7 dniach. Podgląd używa prawdziwego projektu Firebase i prawdziwych danych konta. Testując PR z błędem, można zepsuć własne dane.\n' "$marker" "$preview_url" "$PR_NUMBER")"
          ids="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --jq '.[] | select(.body | contains("<!-- firebase-hosting-preview -->")) | .id')"
          comment_id="${ids%%$'\n'*}"
          comment_id="${comment_id//[[:space:]]/}"
          payload="$(jq -n --arg body "$body" '{body: $body}')"
          if [ -n "$comment_id" ]; then
            if ! [[ "$comment_id" =~ ^[0-9]+$ ]]; then
              echo "::error::Nieprawidłowy identyfikator komentarza."
              exit 1
            fi
            printf '%s' "$payload" | gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" --input -
          else
            printf '%s' "$payload" | gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --input -
          fi
